<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F5;
    --border:#E2E6EB; --border-strong:#D3DBE3;
    --text:#16202B; --text-soft:#5A6673; --text-mute:#8894A2;
    --accent:#1E4E8C; --accent-soft:#E8F0FA; --accent-text:#1E4E8C;
    --pos:#1D6E4E; --pos-soft:#E4F2EB; --neg:#B32B22;
    --radius:8px;
  }
  [data-mode="dark"] {
    --bg:#0E141B; --surface:#161F29; --surface-2:#1D2833;
    --border:#26313D; --border-strong:#35424F;
    --text:#E6EBF0; --text-soft:#93A1B0; --text-mute:#6C7A89;
    --accent:#5B9BE8; --accent-soft:#17293D; --accent-text:#8FBDF0;
    --pos:#59C79A; --pos-soft:#14312A; --neg:#E8776D;
  }
  html { -webkit-text-size-adjust:100%; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:20px 16px 80px}
  .shell{max-width:1180px;margin:0 auto}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
  /* ---------- 공통 메뉴 ---------- */
  .nav{display:flex;gap:4px;margin:14px 0 4px;padding:4px;background:var(--surface-2);border-radius:999px}
  .nav-i{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:40px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:700;
    text-decoration:none;color:var(--text-soft);white-space:nowrap;transition:background .12s,color .12s}
  .nav-i svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.1;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  .nav-i:hover{color:var(--accent-text)}
  .nav-short { display: none; }
  @media (max-width: 480px) {
    .nav-full { display: none; }
    .nav-short { display: inline; }
  }

  .nav-i.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px -3px rgba(30,78,140,.55)}
  [data-mode="dark"] .nav-i.on{color:#0E141B;box-shadow:none}
  @media (max-width:560px){
    .nav{margin:10px 0 2px;gap:2px;padding:3px}
    .nav-i{height:38px;padding:0 8px;font-size:12px;gap:5px}
    .nav-i svg{width:15px;height:15px}
  }
  @media (max-width: 400px) {
    /* 아주 좁은 화면에서는 아이콘을 빼고 글자만 남긴다 */
    .nav-i svg { display: none; }
    .nav-i { padding: 0 4px; gap: 0; font-size: 12px; }
  }
  .topbar-right{display:flex;align-items:center;gap:8px}
  .pill{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--pos-soft);color:var(--pos)}
  .icon-btn{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border-strong);
    background:transparent;color:var(--text-soft);cursor:pointer;font-size:15px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start;margin-top:18px}
  .panel{background:var(--surface);border-radius:12px;padding:16px}
  canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 4px 18px -8px rgba(0,0,0,.25)}
  .panel h3{font-size:13px;font-weight:700;margin:0 0 4px;color:var(--text)}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--text-soft);margin:12px 0 6px}
  select,input[type=text]{width:100%;height:40px;border:1px solid var(--border-strong);border-radius:8px;padding:0 10px;
    font:inherit;font-size:14px;background:var(--bg);color:var(--text)}
  textarea{width:100%;height:300px;font:12.5px/1.6 ui-monospace,Menlo,monospace;border:1px solid var(--border-strong);
    border-radius:8px;padding:10px;background:var(--bg);color:var(--text)}
  .row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
  .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:12px;color:var(--text)}
  .chk input{width:17px;height:17px;accent-color:var(--accent)}
  details{margin-top:14px;font-size:13px;color:var(--text-soft)}
  summary{cursor:pointer;font-weight:700}
  .btn{height:44px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;
    font-size:14px;cursor:pointer;margin-top:16px;width:100%}
  .note{font-size:12px;color:var(--text-mute);line-height:1.7;margin-top:10px}
  @media (max-width:860px){.grid{grid-template-columns:1fr}}
  @media (max-width:560px){body{padding:14px 12px 56px}.brand h1{font-size:15px}
    select,input[type=text]{font-size:16px}}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--border-strong);background:var(--bg);
    font:inherit;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  [data-mode="dark"] .chip.on{color:#0E141B}
  .chip.now{border-style:dashed}
  .mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .mini button{height:28px;padding:0 10px;border-radius:6px;border:0;background:var(--surface-2);color:var(--text-soft);
    font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .warn{font-size:12px;color:var(--neg);min-height:16px;margin-top:6px}
</style>
<style id="nav-wrap">
  @media (max-width: 1100px) {
    .nav { flex-wrap: wrap; border-radius: 18px; gap: 4px; padding: 4px; }
    .nav-i { flex: 1 0 calc(20% - 4px); min-width: 0; border-radius: 12px; }
  }
  @media (max-width: 560px) {
    .nav { gap: 3px; padding: 3px; border-radius: 14px; }
    .nav-i { flex-basis: calc(20% - 3px); height: 38px; padding: 0 4px; gap: 4px; border-radius: 10px; }

  }
  @media (max-width: 340px) {
    .nav-i svg { display: none; }
    .nav-i { height: 38px; }
  }
</style>

<script>
(function () {
  'use strict';
  var T = { paper:'#fafaf8', ink:'#101216', inkSoft:'#6B7078', rule:'#E6E4DD', footer:'#3A3E46',
            gold:'#B8892F', safe:{ top:135, right:100, bottom:135, left:100 },
            grain:{ base:[250,250,248], amount:14, speckle:0.08, spike:2.5 } };
  var CW = 1080, CH = 1350, MAXCOL = 10;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var DATA = null, ON = {};                  // ON[칸 키] = true
  var MK_NAME = { kospi: '코스피', kosdaq: '코스닥', all: '국내주식', us: '미국', us_only: '미국' };
  function isUS() { return /^us/.test($('mk').value); }
  // 미국 국기 — 높이 h, 왼쪽 위 (x, y). 폭은 1.9h
  function drawUSFlag(c, x, y, h) {
    var w = h * 1.9, sh = h / 13, cw = w * 0.4, ch = sh * 7;
    c.save();
    c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, h * 0.08); else c.rect(x, y, w, h); c.clip();
    c.fillStyle = '#ffffff'; c.fillRect(x, y, w, h);
    c.fillStyle = '#B22234';
    for (var i = 0; i < 13; i += 2) c.fillRect(x, y + i * sh, w, sh);
    c.fillStyle = '#3C3B6E'; c.fillRect(x, y, cw, ch);
    c.fillStyle = '#ffffff';
    for (var r = 0; r < 9; r++) for (var k = 0; k < (r % 2 ? 5 : 6); k++) {
      c.beginPath(); c.arc(x + cw * ((k * 2 + (r % 2 ? 2 : 1)) / 12), y + ch * ((r + 1) / 10), h * 0.022, 0, 7); c.fill();
    }
    c.restore();
    c.save(); c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, h * 0.08); else c.rect(x, y, w, h);
    c.lineWidth = Math.max(1, h * 0.025); c.strokeStyle = '#D9D6CE'; c.stroke(); c.restore();
    return w;
  }

  function $(id) { return document.getElementById(id); }
  function font(w, s) { return w + ' ' + s + 'px "Noto Sans KR"'; }
  function fit(text, weight, start, min, maxW) {
    var s = start; ctx.font = font(weight, s);
    while (ctx.measureText(text).width > maxW && s > min) { s -= 1; ctx.font = font(weight, s); }
    return s;
  }
  var _bg = null;
  function grain() {
    if (_bg) return _bg;
    var G = T.grain, S = 512, t = document.createElement('canvas'); t.width = t.height = S;
    var tc = t.getContext('2d'), img = tc.createImageData(S, S), d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var n = (Math.random() - 0.5) * 2 * G.amount;
      if (Math.random() < G.speckle) n += (Math.random() - 0.5) * G.spike * G.amount;
      n = Math.round(n); d[i] = G.base[0] + n; d[i + 1] = G.base[1] + n; d[i + 2] = G.base[2] + n; d[i + 3] = 255;
    }
    tc.putImageData(img, 0, 0);
    _bg = document.createElement('canvas'); _bg.width = CW; _bg.height = CH;
    var b = _bg.getContext('2d'); b.fillStyle = b.createPattern(t, 'repeat'); b.fillRect(0, 0, CW, CH);
    return _bg;
  }
  var LOGO = {};
  function logo(code) {                      // 국내는 logo/kr/코드, 미국은 logo/us/티커
    var dir = /^\d/.test(code) ? 'kr' : 'us', key = dir + '/' + code;
    if (LOGO[key] !== undefined) return LOGO[key];
    var im = new Image(); LOGO[key] = im;
    im.onload = draw; im.onerror = function () { LOGO[key] = null; draw(); };
    im.src = './logo/' + key + '.png';
    return im;
  }
  function ready(im) { return im && im.complete && im.naturalWidth; }

  // 태극기 (시가총액 탭과 같은 그림)
  function drawTaegeuk(c, x, y, h) {
    var w = h * 1.5, cx = x + w / 2, cy = y + h / 2, r = h / 4, a = Math.atan2(2, 3);
    c.save();
    c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, h * 0.08); else c.rect(x, y, w, h);
    c.fillStyle = '#ffffff'; c.fill(); c.lineWidth = Math.max(1, h * 0.025); c.strokeStyle = '#D9D6CE'; c.stroke();
    c.translate(cx, cy); c.rotate(a);
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fillStyle = '#0047A0'; c.fill();
    c.beginPath(); c.arc(0, 0, r, Math.PI, Math.PI * 2); c.fillStyle = '#CD2E3A'; c.fill();
    c.beginPath(); c.arc(-r / 2, 0, r / 2, 0, Math.PI * 2); c.fillStyle = '#CD2E3A'; c.fill();
    c.beginPath(); c.arc(r / 2, 0, r / 2, 0, Math.PI * 2); c.fillStyle = '#0047A0'; c.fill();
    c.rotate(-a);
    var t = h / 24, g = h / 48, L = h / 4, d = r + h / 8 + (3 * t + 2 * g) / 2;
    [[-3, -2, [1, 1, 1]], [3, -2, [0, 1, 0]], [-3, 2, [1, 0, 1]], [3, 2, [0, 0, 0]]].forEach(function (k) {
      c.save(); c.rotate(Math.atan2(k[1], k[0])); c.translate(d, 0); c.fillStyle = '#000000';
      k[2].forEach(function (solid, i) {
        var bx = -(3 * t + 2 * g) / 2 + i * (t + g);
        if (solid) c.fillRect(bx, -L / 2, t, L);
        else { c.fillRect(bx, -L / 2, t, (L - g) / 2); c.fillRect(bx, g / 2, t, (L - g) / 2); }
      });
      c.restore();
    });
    c.restore();
    return w;
  }

  // 시총(억) → '333조' · '8,500억'
  function won(v) {
    if (isUS()) { var u = v / 10000;            // 미국은 억 달러 → $5.1T · $850B
      return u >= 1 ? '$' + u.toFixed(1).replace(/\.0$/, '') + 'T' : '$' + Math.round(v / 10).toLocaleString('en-US') + 'B'; }
    var t = v / 10000;
    return t >= 100 ? Math.round(t).toLocaleString('ko-KR') + '조' : t >= 1 ? t.toFixed(1).replace(/\.0$/, '') + '조'
         : Math.round(v).toLocaleString('ko-KR') + '억';
  }
  // 선 색 = 로고의 대표색 (흰색·투명 빼고 평균). 로고가 없으면 정해 둔 색 중 하나.
  var LCOL = {}, PAL = ['#C0392B', '#2C5AA0', '#1D6E4E', '#B8892F', '#6B4C9A', '#D35400', '#16808A', '#7F8C8D'];
  function lineColor(code) {
    if (LCOL[code]) return LCOL[code];
    var im = logo(code);
    if (!ready(im)) {
      if (im === null || (im && im.complete)) {
        var h = 0; for (var i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) >>> 0;
        return (LCOL[code] = PAL[h % PAL.length]);
      }
      return '#C9C6BC';                         // 아직 불러오는 중
    }
    var c = document.createElement('canvas'); c.width = c.height = 24;
    var g = c.getContext('2d'), r = 0, gg = 0, b = 0, n = 0, d;
    g.drawImage(im, 0, 0, 24, 24);
    try { d = g.getImageData(0, 0, 24, 24).data; } catch (e) { return (LCOL[code] = '#7F8C8D'); }
    for (var k = 0; k < d.length; k += 4) {
      if (d[k + 3] < 120) continue;
      var mx = Math.max(d[k], d[k + 1], d[k + 2]), mn = Math.min(d[k], d[k + 1], d[k + 2]);
      if (mn > 225) continue;                     // 거의 흰색
      var w = 1 + (mx - mn) / 40;                 // 색이 진한 점을 더 쳐 준다
      r += d[k] * w; gg += d[k + 1] * w; b += d[k + 2] * w; n += w;
    }
    if (!n) return (LCOL[code] = '#7F8C8D');
    return (LCOL[code] = 'rgb(' + Math.round(r / n) + ',' + Math.round(gg / n) + ',' + Math.round(b / n) + ')');
  }

  // 로고 그림의 지문 (8×8 밝기 + 평균색). 그림이 같으면 지문도 같다.
  var PRINT = {};
  function logoPrint(code) {
    if (PRINT[code] !== undefined) return PRINT[code];
    var im = logo(code);
    if (!ready(im)) return null;
    var c = document.createElement('canvas'); c.width = c.height = 8;
    var g = c.getContext('2d'), d;
    g.fillStyle = '#fff'; g.fillRect(0, 0, 8, 8); g.drawImage(im, 0, 0, 8, 8);
    try { d = g.getImageData(0, 0, 8, 8).data; } catch (e) { return (PRINT[code] = ''); }
    var v = [], sum = 0;
    for (var i = 0; i < d.length; i += 4) { var y = (d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10; v.push(y); sum += y; }
    var avg = sum / v.length;
    return (PRINT[code] = v.map(function (x) { return x > avg ? 1 : 0; }).join('') + '|' +
            Math.round(d[108] / 32) + Math.round(d[109] / 32) + Math.round(d[110] / 32));
  }
  // 카드에 보이는 회사 중 로고가 같은 묶음을 찾아, 회사마다 짧은 이름을 정한다
  // 이름에서 묶음의 공통 앞부분을 뺀다: 셀트리온헬스케어 → 헬스케어, 셀트리온제약 → 제약, 셀트리온 → 셀트리온
  function sameLogoTags(ks, mk, n) {
    var names = {}, groups = {};
    ks.forEach(function (k) { (DATA.cols[k][mk] || []).slice(0, n).forEach(function (r) { names[r[0]] = r[1]; }); });
    Object.keys(names).forEach(function (c) { var p = logoPrint(c); if (p) (groups[p] = groups[p] || []).push(c); });
    var out = {};
    Object.keys(groups).forEach(function (p) {
      var cs = groups[p]; if (cs.length < 2) return;
      var ns = cs.map(function (c) { return names[c]; }), pre = ns[0];
      ns.forEach(function (x) { while (x.indexOf(pre) !== 0) pre = pre.slice(0, -1); });
      cs.forEach(function (c) {
        var rest = names[c].slice(pre.length).replace(/^[\s·&-]+/, '');
        out[c] = rest.length >= 1 ? rest : names[c];
      });
    });
    return out;
  }

  // ---- 칸(연도) ----
  function keys() {                           // 오래된 해부터, '현재'는 맨 끝 — 고른 시장 자료가 있는 칸만
    var mk = $('mk').value;
    var ks = Object.keys((DATA && DATA.cols) || {}).filter(function (k) { return (DATA.cols[k][mk] || []).length; });
    return ks.filter(function (k) { return k !== 'now'; }).sort().concat(ks.indexOf('now') >= 0 ? ['now'] : []);
  }
  function label(k) {
    if (k !== 'now') return k;
    var d = nowDate().split('-'); return d[0] + '.' + d[1];
  }
  function chosen() { return keys().filter(function (k) { return ON[k]; }); }
  function nowDate() { var c = DATA.cols.now || {}; return (isUS() && c.us_date) || c.date || ''; }
  function preset(p) {
    var ks = keys(); ON = {};
    var pick = p === 'none' ? [] : p === 'r5' ? ks.slice(-5)
             : p === 'five' ? ks.filter(function (k) { return k === 'now' || +k % 5 === 0; }).slice(-MAXCOL)
             : p === 'step' ? ks.filter(function (k, i) { return k === 'now' || (ks.length - 1 - i) % 2 === 1; }).slice(-MAXCOL)
             : ks.slice(-MAXCOL);
    pick.forEach(function (k) { ON[k] = true; });
  }
  function chips() {
    $('years').innerHTML = keys().map(function (k) {
      return '<button type="button" class="chip' + (ON[k] ? ' on' : '') + (k === 'now' ? ' now' : '') +
             '" data-k="' + k + '">' + (k === 'now' ? '현재' : k) + '</button>';
    }).join('');
  }

  // ---- 강조할 회사 목록: 고른 칸들에 한 번이라도 나온 회사 ----
  function fillHi() {
    var mk = $('mk').value, n = +$('n').value, keep = $('hi').value, seen = {}, list = [];
    chosen().slice().reverse().forEach(function (k) {
      (DATA.cols[k][mk] || []).slice(0, n).forEach(function (r) {
        if (!seen[r[0]]) { seen[r[0]] = 1; list.push(r); }
      });
    });
    $('hi').innerHTML = '<option value="">없음</option>' + list.map(function (r) {
      return '<option value="' + r[0] + '">' + r[1] + '</option>'; }).join('');
    $('hi').value = seen[keep] ? keep : '';
  }
  function nameOf(code) {
    var ks = chosen().slice().reverse(), mk = $('mk').value;
    for (var i = 0; i < ks.length; i++) {
      var r = (DATA.cols[ks[i]][mk] || []).filter(function (x) { return x[0] === code; })[0];
      if (r) return r[1];
    }
    return code;
  }
  function autoText() {
    var mk = $('mk').value, hi = $('hi').value;
    $('title').value = MK_NAME[mk] + ' 시총 순위';
    $('sub').value = '';                       // 아래 줄은 비워 둔다 (직접 적으면 나온다)
  }

  function draw() {
    var S = T.safe, X0 = S.left, W = CW - S.left - S.right;
    ctx.clearRect(0, 0, CW, CH);
    ctx.drawImage(grain(), 0, 0);
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';

    // 제목 — 시가총액 탭과 같은 모양: 태극기 + 굵은 시장 이름 + 회색 '시총 순위'
    var title = $('title').value, sub = $('sub').value, flag = $('chk-icon').checked;
    var fr = isUS() ? 1.9 : 1.5;
    var ns = 92, fw = function (s) { return flag ? s * 0.66 * fr + s * 0.24 : 0; };
    ctx.font = font(900, ns);
    while (ns > 36 && ctx.measureText(title).width + fw(ns) > W) { ns -= 1; ctx.font = font(900, ns); }
    var y = S.top + ns * 0.86, XT = X0 + fw(ns);
    if (flag) (isUS() ? drawUSFlag : drawTaegeuk)(ctx, X0, y - ns * 0.37 - ns * 0.33, ns * 0.66);
    var tm = title.match(/^(.*\S)( 시총 순위)$/);
    ctx.fillStyle = T.ink;
    if (tm) { ctx.font = font(900, ns); ctx.fillText(tm[1], XT, y);
      var tw = ctx.measureText(tm[1]).width;
      ctx.font = font(400, ns); ctx.fillStyle = T.inkSoft; ctx.fillText(tm[2], XT + tw, y); }
    else { ctx.font = font(900, ns); ctx.fillText(title, XT, y); }
    if (sub) { var ss = fit(sub, 700, 40, 26, W); y += ns * 0.22 + ss * 0.86;
      ctx.fillStyle = T.inkSoft; ctx.font = font(700, ss); ctx.fillText(sub, X0, y); }

    var footY = CH - S.bottom - 4, ruleY = footY - 27 * 0.85 - 18;
    var ks = chosen(), mk = $('mk').value, n = +$('n').value, hi = $('hi').value;
    if (DATA && ks.length) {
      var top = y + 56, hdr = 52, rk = 58, cw = (W - rk) / ks.length;
      var showCap = $('chk-cap').checked, lines = $('chk-lines').checked;
      // 같은 로고를 쓰는 회사(삼성 계열, 셀트리온 계열 등)는 로고 아래에 짧은 이름을 붙여 구분한다
      var tags = sameLogoTags(ks, mk, n), anyTag = Object.keys(tags).length > 0, showLab = showCap || anyTag;
      var rh = (ruleY - 30 - top - hdr) / n, d = Math.min(cw * 0.8, rh * (showLab ? 0.66 : 0.84), 130);
      var capF = Math.max(11, Math.min(20, Math.round(rh * 0.19)));
      var lift = showLab ? capF * 0.62 : 0;      // 글자 자리만큼 로고를 위로
      // 머리줄: 연도
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ks.forEach(function (k, j) {
        var cx = X0 + rk + cw * (j + 0.5), now = k === 'now';
        ctx.fillStyle = now ? T.gold : T.ink;
        ctx.font = font(900, Math.min(30, Math.round(cw * (now ? 0.24 : 0.3))));
        ctx.fillText(label(k), cx, top + hdr / 2);
      });
      ctx.strokeStyle = T.rule; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(X0, top + hdr); ctx.lineTo(CW - S.right, top + hdr); ctx.stroke();
      // 순위 숫자
      ctx.textAlign = 'left'; ctx.fillStyle = T.inkSoft;
      for (var i = 0; i < n; i++) {
        ctx.font = font(900, Math.min(30, Math.round(rh * 0.42)));
        ctx.fillText(String(i + 1), X0 + 2, top + hdr + rh * (i + 0.5) + 1);
      }
      // 회사별 선 — 해마다 같은 회사를 가는 곡선으로 잇는다.
      // 순위 밖으로 나가거나 새로 들어온 해는 짧게 흐려지는 꼬리만 (아래로 쏟아지는 선을 없앤다).
      if (lines) {
        var gy0 = top + hdr;
        var pos = ks.map(function (k) {
          var m = {}; (DATA.cols[k][mk] || []).slice(0, n).forEach(function (r, i) { m[r[0]] = i; }); return m;
        });
        var codes = {}; pos.forEach(function (m) { Object.keys(m).forEach(function (c) { codes[c] = 1; }); });
        var lw = Math.max(2.4, d * 0.055), tail = cw * 0.36;
        ctx.save();
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        Object.keys(codes).sort(function (a, b) { return a === hi ? 1 : b === hi ? -1 : 0; }).forEach(function (c) {
          var col = lineColor(c), w = c === hi ? lw * 2 : lw;
          ctx.globalAlpha = hi && c !== hi ? 0.1 : 0.8;
          ctx.lineWidth = w; ctx.strokeStyle = col;
          ctx.beginPath();
          for (var j = 0; j < ks.length - 1; j++) {
            var a = pos[j][c], b = pos[j + 1][c];
            if (a == null || b == null) continue;
            var x0 = X0 + rk + cw * (j + 0.5), x1 = x0 + cw;
            var y0 = gy0 + rh * (a + 0.5) - lift, y1 = gy0 + rh * (b + 0.5) - lift;
            ctx.moveTo(x0, y0); ctx.bezierCurveTo(x0 + cw * 0.5, y0, x1 - cw * 0.5, y1, x1, y1);
          }
          ctx.stroke();
          // 꼬리: 나가는 해는 오른쪽 아래로, 들어온 해는 왼쪽 아래에서 — 끝으로 갈수록 투명
          for (var t = 0; t < ks.length; t++) {
            var here = pos[t][c];
            if (here == null) continue;
            var px = X0 + rk + cw * (t + 0.5), py = gy0 + rh * (here + 0.5) - lift;
            [[t < ks.length - 1 && pos[t + 1][c] == null, 1], [t > 0 && pos[t - 1][c] == null, -1]].forEach(function (q) {
              if (!q[0]) return;
              var ex = px + q[1] * tail, ey = py + rh * 0.55;
              var g = ctx.createLinearGradient(px, py, ex, ey);
              g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,255,255,0)');
              ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(px, py);
              ctx.bezierCurveTo(px + q[1] * tail * 0.5, py, ex - q[1] * tail * 0.2, ey - rh * 0.1, ex, ey); ctx.stroke();
            });
          }
        });
        ctx.restore();
      }
      // 강조 회사 — 순위를 선으로 잇는다 (순위 밖인 해는 끊김)
      if (hi && !lines) {
        ctx.save(); ctx.strokeStyle = T.gold; ctx.lineWidth = Math.max(4, d * 0.07);
        ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
        var on = false;
        ks.forEach(function (k, j) {
          var idx = (DATA.cols[k][mk] || []).slice(0, n).map(function (r) { return r[0]; }).indexOf(hi);
          if (idx < 0) { on = false; return; }
          var px = X0 + rk + cw * (j + 0.5), py = top + hdr + rh * (idx + 0.5);
          if (on) ctx.lineTo(px, py); else { ctx.moveTo(px, py); on = true; }
        });
        ctx.stroke(); ctx.restore();
      }
      // 로고
      ks.forEach(function (k, j) {
        (DATA.cols[k][mk] || []).slice(0, n).forEach(function (r, i) {
          var cx = X0 + rk + cw * (j + 0.5), cy = top + hdr + rh * (i + 0.5) - lift, R = d / 2;
          var im = logo(r[0]), has = ready(im);
          if (lines) { ctx.save(); ctx.fillStyle = T.paper; ctx.beginPath();
            ctx.arc(cx, cy, R + Math.max(3, d * 0.06), 0, 7); ctx.fill(); ctx.restore(); }
          ctx.save();
          ctx.globalAlpha = hi && r[0] !== hi ? 0.2 : 1;
          ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip();
          if (has) ctx.drawImage(im, cx - R, cy - R, R * 2, R * 2);
          else {                                  // 로고가 없으면 회색 원에 이름
            ctx.fillStyle = T.inkSoft; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            fit(r[1], 800, Math.round(R * 0.5), 8, R * 1.7); ctx.fillText(r[1], cx, cy + 1);
          }
          ctx.restore();
          var lab = [tags[r[0]], showCap ? won(r[2]) : ''].filter(Boolean).join(' · ');
          if (lab) {
            ctx.save(); ctx.globalAlpha = hi && r[0] !== hi ? 0.25 : 1;
            ctx.fillStyle = tags[r[0]] ? T.ink : T.inkSoft; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            fit(lab, 700, capF, 9, cw * 0.96); ctx.fillText(lab, cx, cy + R + capF * 0.25); ctx.restore();
          }
          if (hi && r[0] === hi) {
            ctx.beginPath(); ctx.arc(cx, cy, R + Math.max(3, d * 0.06), 0, 7);
            ctx.lineWidth = Math.max(3, d * 0.05); ctx.strokeStyle = T.gold; ctx.stroke();
          }
        });
      });
    }
    // 하단
    ctx.textBaseline = 'alphabetic';
    ctx.strokeStyle = T.rule; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(S.left, ruleY); ctx.lineTo(CW - S.right, ruleY); ctx.stroke();
    ctx.fillStyle = T.footer; ctx.font = font(700, 27); ctx.textAlign = 'left';
    var foot = '';
    if (DATA && ON.now && DATA.cols.now && chosen().indexOf('now') >= 0) {
      var a = nowDate().split('-');
      foot = a[0] + '년 ' + (+a[1]) + '월 ' + (+a[2]) + '일 기준';
    }
    ctx.fillText(foot, S.left, footY);
    ctx.textAlign = 'right'; ctx.fillText('@돈굴돈굴', CW - S.right, footY); ctx.textAlign = 'left';
  }

  function refresh() { chips(); fillHi(); autoText(); draw(); }

  $('years').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var k = b.dataset.k;
    if (!ON[k] && chosen().length >= MAXCOL) { $('warn').textContent = '연도는 ' + MAXCOL + '개까지 고를 수 있어요.'; return; }
    $('warn').textContent = ''; ON[k] = !ON[k]; refresh();
  });
  document.querySelector('.mini').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $('warn').textContent = ''; preset(b.dataset.p); refresh();
  });
  $('n').addEventListener('change', refresh);
  var lastRegion = null;
  $('mk').addEventListener('change', function () {   // 국내 ↔ 미국을 바꾸면 연도 고르기도 처음 상태로
    var r = isUS() ? 'us' : 'kr';
    if (r !== lastRegion) { lastRegion = r; LCOL = {}; preset(keys().length > 12 ? 'five' : 'all'); }
    refresh();
  });
  $('hi').addEventListener('change', function () { autoText(); draw(); });
  $('chk-icon').addEventListener('change', draw);
  $('chk-lines').addEventListener('change', draw);
  $('chk-cap').addEventListener('change', draw);
  ['title', 'sub'].forEach(function (id) { $(id).addEventListener('input', draw); });
  $('btn-mode').addEventListener('click', function () {
    var r = document.documentElement;
    r.setAttribute('data-mode', r.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
  });
  $('dl').addEventListener('click', function () {
    var SCALE = 3, big = document.createElement('canvas');
    big.width = CW * SCALE; big.height = CH * SCALE;
    var keep = ctx;
    ctx = big.getContext('2d'); ctx.scale(SCALE, SCALE);
    try { draw(); } finally { ctx = keep; }
    var name = ($('title').value || '시총 순위').replace(/[\s\/\\:*?"<>|]+/g, '_') + '_' +
               chosen().join('-') + '_' + big.width + 'x' + big.height + '.png';
    big.toBlob(function (blob) {
      if (!blob) { alert('그림을 만들지 못했습니다. 새로고침 후 다시 눌러 주세요.'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
    }, 'image/png');
  });

  fetch('./data/rank.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) {
      DATA = j; lastRegion = 'kr'; preset(keys().length > 12 ? 'five' : 'all');
      var ks = keys(), first = ks[0], last = ks.filter(function (k) { return k !== 'now'; }).pop();
      $('src-pill').textContent = '연말 시가총액 ' + first + '~' + (last || '') + (j.cols.now ? ' · 현재 ' + j.cols.now.date : '');
    })
    .catch(function () { $('src-pill').textContent = '데이터 없음'; $('warn').textContent = 'data/rank.json 이 아직 없습니다. collect_rank.py 를 먼저 돌려 주세요.'; })
    .then(function () { if (DATA) { chips(); fillHi(); autoText(); } return document.fonts ? document.fonts.ready : null; })
    .then(draw);
})();
</script>
<script src="./health.js" defer></script>
</body>
