# 돈의 흐름(생키) 카드용 손익 세부 — data/flow/ · 매일, 수집기를 고치면(push) 바로 한 번
name: 손익 흐름 수집 (돈의 흐름 카드)

on:
  schedule:
    - cron: '20 */4 * * *'      # 4시간마다 — 새 보고서 낸 회사만 다시 읽어 금방 끝난다 (처음 채울 땐 여러 번에 나눠)
  push:
    branches: [main]
    paths:
      - 'collect_flow.py'
      - 'flow_xbrl.py'
      - 'xbrl_dims.py'
      - 'flow_audit.py'
      - '.github/workflows/collect_flow.yml'
  workflow_dispatch:
    inputs:
      codes:
        description: "몇 곳만 다시 (쉼표 · 예: 053610,041830) — 비우면 평소대로"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: flow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        part: [kr, us]               # 국내·비상장 / 미국을 따로 (동시에) 돈다
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
          FLOW_MINUTES: '72'
          FLOW_WORKERS: '12'
          FLOW_CODES: ${{ github.event.inputs.codes }}
          FLOW_DART_DAY: '4500'           # DART 하루 2만 번 중 돈의 흐름 몫 (국내 실적 12,000 · 국내5 1,000 · 비상장 1,500 · 합 19,000) — 3분기 보고서 철이라 돈의 흐름 몫을 늘림
        run: |
          mkdir -p data/flow
          python3 -u collect_flow.py --${{ matrix.part }}-only 2>&1 | tee "$RUNNER_TEMP/flow_log.txt"
      - name: 커밋
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/flow)" ]; then echo "변경 없음"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/flow
          git commit -m "손익 흐름 ${{ matrix.part }} $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs --autostash; then
              python3 collect_flow.py --index-only            # 다른 쪽이 먼저 올린 회사까지 목록에 넣는다
              git add data/flow/index.json && (git diff --cached --quiet || git commit -m "손익 흐름 목록")
              git push && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
