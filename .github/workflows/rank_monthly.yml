name: 월말 시총 순위 (영상용)

on:
  schedule:
    # 매주 월요일 15:20 KST (UTC 06:20) — marcap 자료가 쌓인 뒤 올해·작년 달만 다시 만든다
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rank-monthly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 준비
        run: pip install pandas pyarrow
      - name: 월말 순위 만들기
        run: python3 build_rank_monthly.py
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rank_monthly.json
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "월말 시총 순위 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "푸시 재시도 $i"; sleep 10
          done
          echo "푸시 실패"; exit 1
