name: 비상장 로고 찾기

on:
  workflow_dispatch:
    inputs:
      only:
        description: '이 회사들만 다시 (회사코드 8자리, 띄어쓰기로 여러 개 · 비우면 로고 없는 회사 전부)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: logos-unlisted
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 준비
        run: pip install pillow
      - name: 로고 찾기
        run: python3 find_unlisted_logos.py ${{ github.event.inputs.only }}
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo/unlisted logos_check_unlisted.html || true
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "비상장 로고 자동 수집 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "푸시 재시도 $i"; sleep 10
          done
          echo "푸시 실패"; exit 1
