name: 손익 흐름 점검
on:
  push:
    branches: [main]
    paths: ['flow_probe4.py', 'flow_audit.py', '.github/workflows/flow_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 -u flow_probe4.py
