# 1회용 점검 (끝나면 지운다)
name: 손익 흐름 점검
on:
  push:
    branches: [main]
    paths: ['flow_probe3.py', '.github/workflows/flow_probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 점검
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python3 flow_probe3.py 2>&1 | tail -30
      - name: 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/flow/_probe3 && git commit -m "손익 흐름 점검 결과" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs --autostash && git push && exit 0; sleep 10; done
