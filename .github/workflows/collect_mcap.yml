name: 시가총액 수집

on:
  schedule:
    # 평일 16:20 KST (UTC 07:20) — 장 마감(15:30) 뒤 종가 기준. 네이버 금융, 키 필요 없음.
    - cron: '20 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcap-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        run: python3 collect_mcap.py
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mcap.json || true
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "시가총액 자동 수집 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "푸시 재시도 $i"; sleep 10
          done
          echo "푸시 실패"; exit 1
