name: 데이터 상태 점검

on:
  schedule:
    # 매일 09:10 KST (UTC 00:10). 새벽 수집(01:30 비상장 · 02:00 국내 · 02:30 해외 ·
    # 03:00 주가)이 다 끝난 뒤에 돈다. 결과는 data/health.json → 사이트 '데이터 상태'.
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 점검 (DART 최대 60회)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 check_health.py || python3 check_health.py --local

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json || true
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 상태 점검 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "푸시 재시도 $i"; sleep 10
          done
          echo "푸시 실패"; exit 1
