name: 운용사 로고 찾기

on:
  push:
    branches: [main]
    paths: ['fund_logos.py', '.github/workflows/logos_fund.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: python3 fund_logos.py
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo/fund || true
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "운용사 로고 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && exit 0; sleep 10; done
          exit 1
