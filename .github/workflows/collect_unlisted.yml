name: 비상장 실적 수집

on:
  schedule:
    # 매일 01:30 KST (UTC 16:30). DART 한도(하루 2만 회)가 자정에 다시 차고,
    # 국내 실적 수집(collect.yml, 02:00 KST, 1만 8천 회)보다 먼저 돈다.
    # 여기서는 1,500회까지만 써서 두 수집을 합쳐도 한도 안에 든다.
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unlisted-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 수집 (새 회사 먼저, 그다음 7일 지난 회사)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 collect_unlisted.py --budget 1500 --refresh-days 7

      - name: 감사보고서 회사 수집 (남은 예산으로)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 collect_audit.py --total 1500

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unlisted || true
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "비상장 실적 자동 수집 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "푸시 재시도 $i"
            sleep 10
          done
          echo "푸시 실패"; exit 1
