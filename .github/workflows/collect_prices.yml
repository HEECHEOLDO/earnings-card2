name: 연간 수익률 수집

on:
  schedule:
    - cron: '0 18 * * *'       # KST 03:00
  workflow_dispatch:

concurrency:
  group: prices-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 상태 확인
        run: python3 collect_prices.py --status || true

      - name: 수집
        env:
          # Secrets 에 AV_KEY 가 있으면 그 값을, 없으면 코드에 박힌 키를 씁니다.
          AV_KEY: ${{ secrets.AV_KEY }}
        run: python3 collect_prices.py

      - name: 환율 수집
        run: python3 collect_fx.py || true

      - name: 커밋 · 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/returns.json data/monthly_us.json data/fx_usdkrw.json || true
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "연간 수익률 자동 수집 $(date -u +'%Y-%m-%d')"
          # 그 사이 다른 수집이 같은 파일을 올렸으면(2026-11-12 충돌로 실패) 이번에 새로 받은 값으로 덮는다.
          # rebase 중 '-X theirs' = 지금 올리려는 커밋 쪽. 충돌이 남으면 rebase 를 풀고 다시 시도
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "푸시 재시도 $i"
            sleep 10
          done
          echo "푸시 실패"; exit 1
