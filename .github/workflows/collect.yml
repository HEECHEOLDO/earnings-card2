name: DART 데이터 수집

on:
  schedule:
    # 매일 00:30 KST (UTC 15:30) — DART 한도가 자정에 초기화된 직후
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: '이번 실행에서 쓸 API 호출 수'
        required: false
        default: '18000'
      refresh_days:
        description: '며칠 넘은 데이터를 다시 받을지'
        required: false
        default: '9'

permissions:
  contents: write

# 같은 워크플로가 겹쳐 돌지 않게 한다
concurrency:
  group: dart-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: corpcode-${{ github.run_id }}
          restore-keys: corpcode-

      - name: 전체 종목 목록 만들기
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 collect.py --build-tickers

      - name: 수집 (미수집 우선, 그다음 오래된 순서로 갱신)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python3 collect.py --all \
            --budget ${{ github.event.inputs.budget || '18000' }} \
            --refresh-days ${{ github.event.inputs.refresh_days || '9' }} \
            --max-minutes 180

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "새로 받은 데이터가 없습니다."
            exit 0
          fi
          COUNT=$(ls data/*.json 2>/dev/null | wc -l | tr -d ' ')
          git commit -m "데이터 갱신 — 총 ${COUNT}개 파일"
          # 돌아가는 동안 다른 커밋이 올라왔을 수 있으므로 합쳐서 재시도
          for i in 1 2 3 4 5; do
            if git push; then
              echo "푸시 성공"
              exit 0
            fi
            echo "푸시 거부됨 — 원격 변경분을 가져와 재시도 ($i/5)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "5회 시도 후에도 푸시하지 못했습니다."
          exit 1
