name: DART 데이터 수집

on:
  schedule:
    # 매일 00:30 KST (UTC 15:30) — DART 한도가 자정에 초기화된 직후
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: '이번 실행에서 쓸 API 호출 수'
        required: false
        default: '12000'
      refresh_days:
        description: '며칠 넘은 데이터를 다시 받을지'
        required: false
        default: '9'
      again:
        description: '오늘 이미 돌았어도 한 번 더 (yes) — DART 하루 한도 안에서 예산을 줄여서'
        required: false
        default: 'no'

permissions:
  contents: write
  actions: read

# 같은 워크플로가 겹쳐 돌지 않게 한다
concurrency:
  group: dart-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      # 오늘(한국 시간) 이미 끝까지 돈 수집이 있으면 건너뛴다 — 예약 실행이 몇 시간씩 늦어 손으로 먼저 돌린 날, 두 번 돌아 DART 하루 한도(2만)를 넘지 않게
      - name: 오늘 이미 돌았는지 확인
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY=$(date -u -d @$(TZ=Asia/Seoul date -d "today 00:00" +%s) +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?created=>=$DAY&status=success&per_page=20" -q "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          echo "오늘($DAY 이후) 끝난 수집: $N"
          if [ "$N" != "0" ] && [ "${{ github.event.inputs.again }}" != "yes" ]; then echo "skip=1" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: '3.11'

      - name: 캐시 복원
        if: steps.guard.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: .cache
          key: corpcode-${{ github.run_id }}
          restore-keys: corpcode-

      - name: 전체 종목 목록 만들기
        if: steps.guard.outputs.skip != '1'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 collect.py --build-tickers

      - name: 수집 (미수집 우선, 그다음 오래된 순서로 갱신)
        if: steps.guard.outputs.skip != '1'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python3 collect.py --all \
            --budget ${{ github.event.inputs.budget || '12000' }} \
            --refresh-days ${{ github.event.inputs.refresh_days || '9' }} \
            --max-minutes 180

      - name: 변경분 커밋
        if: steps.guard.outputs.skip != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "새로 받은 데이터가 없습니다."
            exit 0
          fi
          COUNT=$(ls data/*.json 2>/dev/null | wc -l | tr -d ' ')
          git commit -m "데이터 갱신 — 총 ${COUNT}개 파일"
          # 돌아가는 동안 다른 커밋이 올라왔을 수 있으므로 합쳐서 재시도
          for i in 1 2 3 4 5; do
            if git push; then
              echo "푸시 성공"
              exit 0
            fi
            echo "푸시 거부됨 — 원격 변경분을 가져와 재시도 ($i/5)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "5회 시도 후에도 푸시하지 못했습니다."
          exit 1
