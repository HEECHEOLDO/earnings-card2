<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시가총액 · 돈굴돈굴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F5;
    --border:#E2E6EB; --border-strong:#D3DBE3;
    --text:#16202B; --text-soft:#5A6673; --text-mute:#8894A2;
    --accent:#1E4E8C; --accent-soft:#E8F0FA; --accent-text:#1E4E8C;
    --pos:#1D6E4E; --pos-soft:#E4F2EB; --neg:#B32B22;
    --radius:8px;
  }
  [data-mode="dark"] {
    --bg:#0E141B; --surface:#161F29; --surface-2:#1D2833;
    --border:#26313D; --border-strong:#35424F;
    --text:#E6EBF0; --text-soft:#93A1B0; --text-mute:#6C7A89;
    --accent:#5B9BE8; --accent-soft:#17293D; --accent-text:#8FBDF0;
    --pos:#59C79A; --pos-soft:#14312A; --neg:#E8776D;
  }
  html { -webkit-text-size-adjust:100%; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:20px 16px 80px}
  .shell{max-width:1180px;margin:0 auto}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
  /* ---------- 공통 메뉴 ---------- */
  .nav{display:flex;gap:4px;margin:14px 0 4px;padding:4px;background:var(--surface-2);border-radius:999px}
  .nav-i{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:40px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:700;
    text-decoration:none;color:var(--text-soft);white-space:nowrap;transition:background .12s,color .12s}
  .nav-i svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.1;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  .nav-i:hover{color:var(--accent-text)}
  .nav-short { display: none; }
  @media (max-width: 480px) {
    .nav-full { display: none; }
    .nav-short { display: inline; }
  }

  .nav-i.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px -3px rgba(30,78,140,.55)}
  [data-mode="dark"] .nav-i.on{color:#0E141B;box-shadow:none}
  @media (max-width:560px){
    .nav{margin:10px 0 2px;gap:2px;padding:3px}
    .nav-i{height:38px;padding:0 8px;font-size:12px;gap:5px}
    .nav-i svg{width:15px;height:15px}
  }
  @media (max-width: 400px) {
    /* 아주 좁은 화면에서는 아이콘을 빼고 글자만 남긴다 */
    .nav-i svg { display: none; }
    .nav-i { padding: 0 4px; gap: 0; font-size: 12px; }
  }
  .topbar-right{display:flex;align-items:center;gap:8px}
  .pill{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--pos-soft);color:var(--pos)}
  .icon-btn{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border-strong);
    background:transparent;color:var(--text-soft);cursor:pointer;font-size:15px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start;margin-top:18px}
  .panel{background:var(--surface);border-radius:12px;padding:16px}
  canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 4px 18px -8px rgba(0,0,0,.25)}
  .panel h3{font-size:13px;font-weight:700;margin:0 0 4px;color:var(--text)}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--text-soft);margin:12px 0 6px}
  select,input[type=text]{width:100%;height:40px;border:1px solid var(--border-strong);border-radius:8px;padding:0 10px;
    font:inherit;font-size:14px;background:var(--bg);color:var(--text)}
  textarea{width:100%;height:300px;font:12.5px/1.6 ui-monospace,Menlo,monospace;border:1px solid var(--border-strong);
    border-radius:8px;padding:10px;background:var(--bg);color:var(--text)}
  .row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
  .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:12px;color:var(--text)}
  .chk input{width:17px;height:17px;accent-color:var(--accent)}
  details{margin-top:14px;font-size:13px;color:var(--text-soft)}
  summary{cursor:pointer;font-weight:700}
  .btn{height:44px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;
    font-size:14px;cursor:pointer;margin-top:16px;width:100%}
  .note{font-size:12px;color:var(--text-mute);line-height:1.7;margin-top:10px}
  @media (max-width:860px){.grid{grid-template-columns:1fr}}
  @media (max-width:560px){body{padding:14px 12px 56px}.brand h1{font-size:15px}
    select,input[type=text]{font-size:16px}}
</style>
</head>
<body>
<div class="shell">

    <div class="topbar-right">

  <nav class="nav" aria-label="메뉴">

  <div class="grid">
    <div class="panel"><canvas id="cv" width="1080" height="1350"></canvas></div>
    <div class="panel">
      <h3>카드 만들기</h3>
      <div class="row">
        <div><label class="f" for="mk">시장</label>
          <select id="mk"><option value="kospi" selected>코스피</option><option value="kosdaq">코스닥</option><option value="all">국내 전체 (코스피+코스닥)</option><option value="industry">업종별…</option><option value="theme">테마별…</option></select></div>
        <div><label class="f" for="n">순위</label>

      <label class="chk"><input type="checkbox" id="ring"> 테두리를 올해 등락률 색으로 (오름 빨강 · 내림 파랑)</label>

        <textarea id="data" spellcheck="false"></textarea>
      </details>
      <button class="btn" id="dl">PNG 내려받기</button>
      <p class="note">로고 원의 <b>넓이</b>가 시가총액에 비례합니다. ETF·우선주는 빼고 보통주만 셉니다. 작은 원에는 로고만 들어갑니다.</p>

<script>
(function () {
  'use strict';
  var T = { paper:'#fafaf8', ink:'#101216', inkSoft:'#6B7078', rule:'#E6E4DD', footer:'#3A3E46',
            up:'#C0392B', down:'#2C5AA0', flat:'#C9C6BC',
            safe:{ top:135, right:100, bottom:135, left:100 },
            grain:{ base:[250,250,248], amount:14, speckle:0.08, spike:2.5 } };
  var CW = 1080, CH = 1350;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');

  // 모양을 보기 위한 샘플 — 실제 값 아님 (코드 이름 시총조원 올해등락%)
  var SAMPLE = [
    '005930 삼성전자 600 +45', '000660 SK하이닉스 320 +80', '373220 LG에너지솔루션 90 -8',
    '207940 삼성바이오로직스 75 +12', '005380 현대차 52 +6', '034020 두산에너빌리티 50 +140',
    '012450 한화에어로스페이스 45 +60', '105560 KB금융 42 +30', '000270 기아 40 +3',
    '068270 셀트리온 38 -5', '329180 HD현대중공업 35 +55', '055550 신한지주 33 +25',
    '402340 SK스퀘어 30 +90', '035420 NAVER 30 +10', '042660 한화오션 30 +70',
    '028260 삼성물산 30 +35', '009540 HD한국조선해양 25 +40', '005490 POSCO홀딩스 25 -12',
    '032830 삼성생명 25 +20', '015760 한국전력 25 +45', '012330 현대모비스 25 +8',
    '086790 하나금융지주 22 +28', '138040 메리츠금융지주 22 +15', '035720 카카오 20 +18',
    '006400 삼성SDI 20 -20', '010130 고려아연 20 -10', '000810 삼성화재 20 +12',
    '011200 HMM 18 -3', '064350 현대로템 18 +95', '051910 LG화학 18 -15',
    '003550 LG 17 +5', '017670 SK텔레콤 16 +10', '316140 우리금융지주 16 +30',
    '018260 삼성에스디에스 15 +2', '010140 삼성중공업 15 +60', '267260 HD현대일렉트릭 15 +50',
    '030200 KT 14 +15', '003670 포스코퓨처엠 14 -25', '096770 SK이노베이션 13 -8',
    '034730 SK 13 +20', '047810 한국항공우주 13 +35', '033780 KT&G 12 +12',
    '066570 LG전자 12 -6', '259960 크래프톤 12 +4', '024110 기업은행 11 +18',
    '323410 카카오뱅크 11 -2', '009150 삼성전기 11 +25', '010950 S-Oil 10 -4',
    '000100 유한양행 10 +7', '352820 하이브 10 -9'
  ];
  // data/mcap.json (collect_mcap.py 가 매일 만든다)을 읽는다. 없으면 샘플.
  var DATA = null;
  function fill() {
    var mk = document.getElementById('mk').value, lines;
    var src = mk === 'all' && DATA
      ? (DATA.kospi || []).concat(DATA.kosdaq || []).sort(function (a, b) { return b.cap - a.cap; })
      : DATA && DATA[mk];
    var wrap = document.getElementById('grp-wrap'), gsel = document.getElementById('grp');
    var isGrp = mk === 'industry' || mk === 'theme';
    wrap.style.display = isGrp ? '' : 'none';
    if (isGrp) {
      var gs = (DATA && DATA.groups && DATA.groups[mk]) || [];
      document.getElementById('grp-label').textContent = mk === 'industry' ? '업종' : '테마';
      if (gsel.dataset.kind !== mk) {          // 목록은 종류가 바뀔 때만 다시 채운다
        gsel.innerHTML = gs.map(function (g, i) {
          return '<option value="' + i + '">' + g.name + ' · ' + g.n + '</option>'; }).join('');
        gsel.dataset.kind = mk;
      }
      var g = gs[+gsel.value || 0];
      src = g ? g.codes.map(function (c) { var s = DATA.stocks[c] || {};
        return { code: c, name: s.n || c, cap: s.c || 0, ytd: s.y }; }) : [];
    }
    if (src && src.length) {
      lines = src.map(function (r) {
        return r.code + ' ' + r.name.replace(/\s+/g, '') + ' ' + (r.cap / 10000).toFixed(2) +
          (r.ytd != null ? ' ' + (r.ytd > 0 ? '+' : '') + r.ytd : '');
      });
    } else lines = SAMPLE;
    document.getElementById('data').value = lines.join('\n');
    autoText();
  }
  function autoText() {
    var mk = document.getElementById('mk').value, n = document.getElementById('n').value;
    var cnt = document.getElementById('data').value.split('\n').filter(function (l) { return l.trim(); }).length;
    var gname = '';
    if (mk === 'industry' || mk === 'theme') {
      var gg = ((DATA && DATA.groups && DATA.groups[mk]) || [])[+document.getElementById('grp').value || 0];
      gname = gg ? gg.name.replace(/\s*\([^)]*\)\s*/g, ' ').trim() + ' ' : '';
      var inner = gg ? (gg.name.match(/\(([^)]*)\)/) || [])[1] : '';
      if (inner) gname += '\u0000' + inner + '\u0000';   // 아래 줄로 넘길 표시
    }
    var gpart = gname.split('\u0000');      // [이름, 괄호 안, '']
    document.getElementById('title').value = gpart[0] + '시가총액 TOP ' + Math.min(+n, cnt || +n);
    var a = DATA && DATA.asof ? DATA.asof.split('-') : null;
    var d = a ? " ('" + a[0].slice(2) + '년 ' + (+a[1]) + '월 ' + (+a[2]) + '일 기준)' : ' (샘플)';
    document.getElementById('sub').value = { kospi: '코스피', kosdaq: '코스닥', all: '국내 주식', industry: '업종', theme: '테마' }[mk] +
      (gpart && gpart[1] ? ' · ' + gpart[1] : '') + d;
  }

  function font(w, s) { return w + ' ' + s + 'px "Noto Sans KR"'; }
  function fit(text, weight, start, min, maxW) {
    var s = start; ctx.font = font(weight, s);
    while (ctx.measureText(text).width > maxW && s > min) { s -= 1; ctx.font = font(weight, s); }
    return s;
  }
  var _bg = null;
  function grain() {
    if (_bg) return _bg;
    var G = T.grain, S = 512, t = document.createElement('canvas'); t.width = t.height = S;
    var tc = t.getContext('2d'), img = tc.createImageData(S, S), d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var n = (Math.random() - 0.5) * 2 * G.amount;
      if (Math.random() < G.speckle) n += (Math.random() - 0.5) * G.spike * G.amount;
      n = Math.round(n); d[i] = G.base[0] + n; d[i + 1] = G.base[1] + n; d[i + 2] = G.base[2] + n; d[i + 3] = 255;
    }
    tc.putImageData(img, 0, 0);
    _bg = document.createElement('canvas'); _bg.width = CW; _bg.height = CH;
    var b = _bg.getContext('2d'); b.fillStyle = b.createPattern(t, 'repeat'); b.fillRect(0, 0, CW, CH);
    return _bg;
  }

  function parse() {
    var out = [];
    document.getElementById('data').value.split(/\n/).forEach(function (l) {
      var p = l.trim().split(/\s+/);
      if (p.length < 3) return;
      var v = parseFloat(p[2].replace(/,/g, ''));
      if (!(v > 0)) return;
      out.push({ code: p[0], name: p[1], v: v, chg: p[3] != null ? parseFloat(p[3]) : null });
    });
    out.sort(function (a, b) { return b.v - a.v; });
    return out;
  }

  /* ---- 원 쌓기 ----
     큰 것부터 하나씩, 이미 놓인 두 원에 동시에 닿는 자리 중 가운데에 가장 가까운
     곳에 놓는다. 가운데까지 거리는 그릴 칸의 가로세로 비율로 잰다 (칸을 고르게 채우게). */
  function pack(rs, aspect) {
    var P = [];
    function ok(x, y, r) {
      for (var k = 0; k < P.length; k++) {
        var dx = P[k].x - x, dy = P[k].y - y;
        if (dx * dx + dy * dy < (P[k].r + r) * (P[k].r + r) - 1e-6) return false;
      }
      return true;
    }
    function cost(x, y) { return (x * x) / (aspect * aspect) + y * y; }
    rs.forEach(function (r, i) {
      if (i === 0) { P.push({ x: 0, y: 0, r: r }); return; }
      if (i === 1) { P.push({ x: P[0].r + r, y: 0, r: r }); return; }
      var best = null, bc = Infinity;
      for (var a = 0; a < P.length; a++) for (var b = a + 1; b < P.length; b++) {
        var A = P[a], B = P[b], ra = A.r + r, rb = B.r + r;
        var dx = B.x - A.x, dy = B.y - A.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d > ra + rb || d < Math.abs(ra - rb) || d === 0) continue;
        var l = (ra * ra - rb * rb + d * d) / (2 * d), h = Math.sqrt(Math.max(0, ra * ra - l * l));
        var mx = A.x + l * dx / d, my = A.y + l * dy / d;
        [[mx - h * dy / d, my + h * dx / d], [mx + h * dy / d, my - h * dx / d]].forEach(function (c) {
          var cc = cost(c[0], c[1]);
          if (cc < bc && ok(c[0], c[1], r)) { bc = cc; best = c; }
        });
      }
      if (!best) best = [P[0].r * 4 + r, 0];
      P.push({ x: best[0], y: best[1], r: r });
    });
    return P;
  }

  var LOGO = {};
  function logo(code) {
    if (LOGO[code] !== undefined) return LOGO[code];
    var im = new Image(); LOGO[code] = im;
    im.onload = draw; im.onerror = function () { LOGO[code] = null; draw(); };
    im.src = './logo/kr/' + code + '.png';
    return im;
  }
  function ready(im) { return im && im.complete && im.naturalWidth; }
  // 로고의 한 부분(비율 좌표 x,y,w,h)이 얼마나 밝은지 0~1. 로고마다 한 번만 잰다.
  var BRIGHT = {};
  function brightness(im, x, y, w, h) {
    var key = im.src + '|' + [x, y, w, h].join(',');
    if (BRIGHT[key] != null) return BRIGHT[key];
    var c = document.createElement('canvas'); c.width = c.height = 32;
    var g = c.getContext('2d'); g.drawImage(im, 0, 0, 32, 32);
    var d, sum = 0, n = 0;
    try { d = g.getImageData(Math.round(x * 32), Math.round(y * 32), Math.round(w * 32), Math.round(h * 32)).data; }
    catch (e) { return (BRIGHT[key] = 0); }
    for (var i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 40) continue;             // 투명한 곳은 빼고
      sum += (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255; n++;
    }
    return (BRIGHT[key] = n ? sum / n : 1);
  }
  function money(v) { return (v >= 100 ? Math.round(v).toLocaleString('ko-KR') : v.toFixed(1).replace(/\.0$/, '')) + '조'; }

  function draw() {
    var all = parse(), n = +document.getElementById('n').value;
    var rows = all.slice(0, n), showNames = document.getElementById('names').checked;
    var ringOn = document.getElementById('ring').checked;
    var S = T.safe, X0 = S.left, W = CW - S.left - S.right;

    ctx.clearRect(0, 0, CW, CH);
    ctx.drawImage(grain(), 0, 0);

    // 헤드라인 (다른 카드와 같은 자리·굵기)
    ctx.fillStyle = T.ink; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    var title = document.getElementById('title').value, sub = document.getElementById('sub').value;
    var ns = fit(title, 900, 92, 36, W), y = S.top + ns * 0.86;
    ctx.font = font(900, ns); ctx.fillText(title, X0, y);
    var ss = fit(sub, 700, 40, 26, W); y += ns * 0.22 + ss * 0.86;
    ctx.fillStyle = T.inkSoft; ctx.font = font(700, ss); ctx.fillText(sub, X0, y);

    // 버블 영역
    var top = y + 50, footY = CH - S.bottom - 4, bottom = footY - 27 * 0.85 - 18 - 40;
    var AW = W, AH = bottom - top;
    if (!rows.length) return foot(footY);
    var gap = 0.035;
    var rs = rows.map(function (r) { return Math.sqrt(r.v); });
    // 칸을 가장 크게 채우는 배치를 고른다 — 쌓는 비율을 몇 가지로 바꿔 보고,
    // 다 쌓은 뒤 돌려 보며(원 모양은 그대로) 원이 가장 커지는 것을 쓴다.
    var best = null;
    [0.6, 0.8, 1, 1.25, 1.6].forEach(function (f) {
      var Q = pack(rs.map(function (r) { return r * (1 + gap); }), AW / AH * f);
      for (var t = 0; t < 180; t += 6) {
        var c = Math.cos(t * Math.PI / 180), s2 = Math.sin(t * Math.PI / 180);
        var R2 = Q.map(function (p) { return { x: p.x * c - p.y * s2, y: p.x * s2 + p.y * c, r: p.r }; });
        var a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
        R2.forEach(function (p) { a0 = Math.min(a0, p.x - p.r); a1 = Math.max(a1, p.x + p.r);
                                  b0 = Math.min(b0, p.y - p.r); b1 = Math.max(b1, p.y + p.r); });
        var kk = Math.min(AW / (a1 - a0), AH / (b1 - b0));
        if (!best || kk > best.k) best = { P: R2, k: kk, minX: a0, maxX: a1, minY: b0, maxY: b1 };
      }
    });
    var P = best.P, k = best.k, minX = best.minX, maxX = best.maxX, minY = best.minY, maxY = best.maxY;
    var ox = X0 + (AW - (maxX - minX) * k) / 2 - minX * k, oy = top + (AH - (maxY - minY) * k) / 2 - minY * k;

    rows.forEach(function (r, i) {
      var cx = ox + P[i].x * k, cy = oy + P[i].y * k, R = rs[i] * k;
      var im = logo(r.code), has = ready(im);
      var ring = !ringOn || r.chg == null || isNaN(r.chg) ? T.flat : r.chg > 0 ? T.up : r.chg < 0 ? T.down : T.flat;
      ctx.save();
      // 로고가 원을 꽉 채운다 — 원의 넓이 = 시가총액. 흰 바탕·바깥 테두리 없음.
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip();
      if (has) {
        ctx.drawImage(im, cx - R, cy - R, R * 2, R * 2);
      } else {                                // 로고 파일이 없으면 회색 원에 이름
        ctx.fillStyle = T.inkSoft; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        fit(r.name, 900, Math.round(R * 0.42), 9, R * 1.6);
        ctx.fillText(r.name, cx, cy);
      }
      ctx.restore();
      if (ringOn) {                           // 크기는 그대로, 원 안쪽 가장자리에만 색
        var lw = Math.max(3, R * 0.05);
        ctx.beginPath(); ctx.arc(cx, cy, R - lw / 2, 0, 7);
        ctx.lineWidth = lw; ctx.strokeStyle = ring; ctx.stroke();
      }
      // 큰 원에는 아래쪽에 이름·시총 — 바탕 없이 글자만. 글자 자리의 로고 밝기를 재서
      // 어두우면 흰 글자 + 어두운 그림자, 밝으면 검은 글자 + 흰 그림자 (어느 로고에서도 읽히게)
      if (showNames && has && R >= 72) {     // 이보다 작으면 글자가 로고를 가린다
        var nf = Math.max(14, Math.min(44, Math.round(R * 0.18)));
        var vf = Math.round(nf * 0.8);
        var base = cy + R * 0.62;                       // 이름 글자 바닥선
        var light = brightness(im, 0.5 - 0.45, 0.62 - 0.12, 0.9, 0.3) > 0.62;
        var fg = light ? T.ink : '#ffffff';
        var halo = light ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.22)';   // 그림자는 옅게 — 글자가 탁해 보이지 않게
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.lineJoin = 'round';
        ctx.shadowColor = halo; ctx.shadowBlur = nf * 0.3;
        fit(r.name, 900, nf, 11, R * 1.55);
        ctx.lineWidth = Math.max(1.5, nf * (light ? 0.14 : 0.06)); ctx.strokeStyle = halo;
        ctx.strokeText(r.name, cx, base); ctx.fillStyle = fg; ctx.fillText(r.name, cx, base);
        ctx.font = font(800, vf);
        ctx.lineWidth = Math.max(1.5, vf * (light ? 0.14 : 0.06));
        ctx.strokeText(money(r.v), cx, base + vf * 1.12);
        ctx.globalAlpha = 0.92; ctx.fillText(money(r.v), cx, base + vf * 1.12);
        ctx.restore();
      }
    });
    foot(footY);
  }

  function foot(footY) {
    var S = T.safe;
    ctx.strokeStyle = T.rule; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(S.left, footY - 27 * 0.85 - 18); ctx.lineTo(CW - S.right, footY - 27 * 0.85 - 18); ctx.stroke();
    ctx.fillStyle = T.footer; ctx.font = font(700, 27);
    ctx.textAlign = 'right'; ctx.fillText('@돈굴돈굴', CW - S.right, footY); ctx.textAlign = 'left';
  }

  ['names', 'title', 'sub', 'data', 'ring'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', draw);
    document.getElementById(id).addEventListener('change', draw);
  });
  document.getElementById('n').addEventListener('change', function () { autoText(); draw(); });
  document.getElementById('mk').addEventListener('change', function () { fill(); draw(); });
  document.getElementById('grp').addEventListener('change', function () { fill(); draw(); });
  document.getElementById('btn-mode').addEventListener('click', function () {
    var r = document.documentElement;
    r.setAttribute('data-mode', r.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('dl').addEventListener('click', function () {
    // 다른 카드와 같이 3배(3240×4050)로 다시 그려 파일로 저장한다.
    // data: 주소로 넘기면 사파리·파이어폭스에서 큰 그림이 안 받아져 Blob 으로 넘긴다.
    var SCALE = 3, big = document.createElement('canvas');
    big.width = CW * SCALE; big.height = CH * SCALE;
    var keep = ctx;
    ctx = big.getContext('2d'); ctx.scale(SCALE, SCALE);
    try { draw(); } finally { ctx = keep; }
    var mkEl = document.getElementById('mk');
    var name = (document.getElementById('title').value || '시가총액').replace(/[\s\/\\:*?"<>|]+/g, '_') +
               (mkEl ? '_' + mkEl.value : '') + '_' + big.width + 'x' + big.height + '.png';
    big.toBlob(function (blob) {
      if (!blob) { alert('그림을 만들지 못했습니다. 새로고침 후 다시 눌러 주세요.'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
    }, 'image/png');
  });
  fetch('./data/mcap.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) { DATA = j;
      document.getElementById('src-pill').textContent =
        '코스피·코스닥 시가총액 · ' + (j.asof || j.updated); })
    .catch(function () { document.getElementById('src-pill').textContent = '샘플 데이터'; })
    .then(function () { fill(); return document.fonts ? document.fonts.ready : null; })
    .then(draw);
})();
</script>
<script src="./health.js" defer></script>
</body>
