<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종목 스크리닝 · 실적·배당 카드뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F5;
    --border:#E2E6EB; --border-strong:#D3DBE3;
    --text:#16202B; --text-soft:#5A6673; --text-mute:#8894A2;
    --accent:#1E4E8C; --accent-soft:#E8F0FA; --accent-text:#1E4E8C;
    --pos:#1D6E4E; --pos-soft:#E4F2EB; --neg:#B32B22;
    --radius:8px;
  }
  [data-mode="dark"] {
    --bg:#0E141B; --surface:#161F29; --surface-2:#1D2833;
    --border:#26313D; --border-strong:#35424F;
    --text:#E6EBF0; --text-soft:#93A1B0; --text-mute:#6C7A89;
    --accent:#5B9BE8; --accent-soft:#17293D; --accent-text:#8FBDF0;
    --pos:#59C79A; --pos-soft:#14312A; --neg:#E8776D;
  }
  html { -webkit-text-size-adjust:100%; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:20px 16px 80px}
  .shell{max-width:1180px;margin:0 auto}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
  .navlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
    text-decoration:none;white-space:nowrap;height:34px;padding:0 14px;border-radius:999px;
    background:var(--accent);color:#fff;box-shadow:0 2px 8px -2px rgba(30,78,140,.5);
    transition:opacity .12s,transform .1s}
  .navlink:hover{opacity:.9}
  .navlink:active{transform:translateY(1px)}
  [data-mode="dark"] .navlink{color:#0E141B;box-shadow:none}
  .topbar-right{display:flex;align-items:center;gap:8px}
  .pill{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
    background:var(--pos-soft);color:var(--pos)}
  .icon-btn{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border-strong);
    background:transparent;color:var(--text-soft);cursor:pointer;font-size:15px}

  h2.sec{font-size:13px;font-weight:700;margin:22px 0 10px;color:var(--text-soft)}

  .presets{display:flex;gap:8px;flex-wrap:wrap}
  .preset{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    padding:9px 14px;border-radius:999px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--text)}
  .preset:hover{border-color:var(--accent);color:var(--accent)}
  .preset[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}

  .filters{background:var(--surface);border-radius:12px;padding:16px 16px 8px;margin-top:12px}
  .fgroup{margin-bottom:14px}
  .fgroup > h3{font-size:12px;font-weight:700;color:var(--text-mute);margin:0 0 8px;
    letter-spacing:.02em}
  .frow{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 12px}
  .f{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-soft)}
  .f .nm{flex:1;min-width:0}
  .f input{width:62px;height:34px;text-align:right;font-family:inherit;font-size:13px;
    color:var(--text);background:var(--bg);border:1px solid var(--border-strong);
    border-radius:6px;padding:0 7px}
  .f input:focus{outline:none;border-color:var(--accent)}
  .f input.on{border-color:var(--accent);background:var(--accent-soft)}
  .f .tilde{color:var(--text-mute);font-size:12px}
  .f .unit{color:var(--text-mute);font-size:11.5px;width:22px}

  .marketrow{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--text-soft)}
  .marketrow label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .marketrow input{width:17px;height:17px;accent-color:var(--accent)}

  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
  .btn{font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border-radius:var(--radius);
    padding:0 16px;height:40px;border:1px solid var(--border-strong);background:transparent;color:var(--text)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .count{font-size:14px;font-weight:700;color:var(--text)}
  .count b{color:var(--accent-text)}
  .sortsel{height:40px;font-family:inherit;font-size:13px;color:var(--text);background:var(--surface);
    border:1px solid var(--border-strong);border-radius:var(--radius);padding:0 10px;margin-left:auto}

  .tablewrap{background:var(--surface);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
  th,td{padding:9px 10px;text-align:right}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  thead th{color:var(--text-soft);font-weight:600;border-bottom:1px solid var(--border-strong);
    position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
  thead th:hover{color:var(--accent)}
  tbody td{border-bottom:1px solid var(--border)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface-2)}
  td.name{font-weight:700}
  td .mk{font-size:11px;color:var(--text-mute);margin-left:6px;font-weight:400}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .empty{padding:40px 16px;text-align:center;color:var(--text-mute);font-size:14px}
  .note{font-size:12px;color:var(--text-mute);margin-top:10px;line-height:1.7}

  @media (max-width:560px){
    body{padding:14px 12px 56px}
    .brand h1{font-size:15px}
    .topbar{flex-direction:column;align-items:stretch;gap:10px}
    .topbar-right{width:100%;justify-content:flex-start}
    .pill{flex:1;min-width:0;white-space:normal;line-height:1.5;
      font-size:11.5px;padding:6px 11px;border-radius:12px}
    .brand{width:100%;justify-content:space-between;align-items:center}
    .navlink{height:32px;padding:0 12px;font-size:12.5px}
    .f input{font-size:16px;width:58px}
    .frow{grid-template-columns:1fr}
    .filters{padding:13px 13px 5px}
    .sortsel{margin-left:0;width:100%;font-size:16px}
    th,td{padding:8px 8px;font-size:12px}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand">
      <h1>종목 스크리닝</h1>
      <a href="./index.html" class="navlink">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path>
        </svg>
        카드 만들기
      </a>
    </div>
    <div class="topbar-right">
      <span class="pill" id="src-pill">불러오는 중…</span>
      <button class="icon-btn" id="btn-mode" aria-label="다크 모드">◐</button>
    </div>
  </div>

  <h2 class="sec">빠른 조건</h2>
  <div class="presets" id="presets"></div>

  <div class="filters">
    <div class="fgroup">
      <h3>기본</h3>
      <div class="marketrow" id="markets"></div>
    </div>
    <div class="fgroup"><h3>규모 · 수익성</h3><div class="frow" id="g-profit"></div></div>
    <div class="fgroup"><h3>성장성</h3><div class="frow" id="g-growth"></div></div>
    <div class="fgroup"><h3>배당</h3><div class="frow" id="g-div"></div></div>
    <div class="fgroup"><h3>안정성</h3><div class="frow" id="g-stable"></div></div>
    <div class="fgroup"><h3>분기 모멘텀</h3><div class="frow" id="g-q"></div></div>
  </div>

  <div class="bar">
    <span class="count" id="count"></span>
    <button class="btn" id="btn-reset">조건 초기화</button>
    <button class="btn" id="btn-csv">CSV 내려받기</button>
    <select class="sortsel" id="sort"></select>
  </div>

  <div class="tablewrap">
    <table id="tbl"><thead></thead><tbody></tbody></table>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

  <p class="note">
    DART 공시 기준. 주가가 필요한 지표(PER·PBR·시가총액)는 제공하지 않습니다.
    시가배당률은 각 사업보고서에 공시된 값이라 현재 주가 기준이 아닙니다.
    종목을 누르면 카드 만들기 화면으로 이동합니다.
  </p>

</div>

<script>
(function () {
  'use strict';

  /* ---------- 필터 정의 ---------- */
  var FILTERS = [
    { g:'g-profit', k:'rev',        n:'매출',            u:'억' },
    { g:'g-profit', k:'op',         n:'영업이익',        u:'억' },
    { g:'g-profit', k:'margin',     n:'영업이익률',      u:'%' },
    { g:'g-profit', k:'netMargin',  n:'순이익률',        u:'%' },
    { g:'g-profit', k:'roe',        n:'ROE',            u:'%' },
    { g:'g-profit', k:'roeAvg',     n:'5년 평균 ROE',    u:'%' },
    { g:'g-profit', k:'roa',        n:'ROA',            u:'%' },

    { g:'g-growth', k:'revCagr3',   n:'매출 CAGR 3년',   u:'%' },
    { g:'g-growth', k:'revCagr5',   n:'매출 CAGR 5년',   u:'%' },
    { g:'g-growth', k:'revCagr10',  n:'매출 CAGR 10년',  u:'%' },
    { g:'g-growth', k:'opCagr5',    n:'영업이익 CAGR 5년', u:'%' },
    { g:'g-growth', k:'revStreak',  n:'연속 매출 증가',   u:'년' },

    { g:'g-div',    k:'dps',        n:'주당배당금',      u:'원' },
    { g:'g-div',    k:'payout',     n:'배당성향',        u:'%' },
    { g:'g-div',    k:'yield',      n:'시가배당률',      u:'%' },
    { g:'g-div',    k:'dpsCagr5',   n:'배당 CAGR 5년',   u:'%' },
    { g:'g-div',    k:'divYears',   n:'연속 배당',       u:'년' },
    { g:'g-div',    k:'divGrowYears', n:'연속 배당 증가', u:'년' },

    { g:'g-stable', k:'debt',       n:'부채비율',        u:'%' },
    { g:'g-stable', k:'profitStreak', n:'연속 흑자',     u:'년' },
    { g:'g-stable', k:'lossCount',  n:'적자 횟수',       u:'회' },
    { g:'g-stable', k:'marginStd',  n:'이익률 변동성',   u:'' },
    { g:'g-stable', k:'years',      n:'데이터 보유',     u:'년' },
    { g:'g-stable', k:'turnaround', n:'흑자전환(1=예)',  u:'' },

    { g:'g-q',      k:'qMargin',    n:'분기 영업이익률', u:'%' },
    { g:'g-q',      k:'qRevYoy',    n:'분기 매출 YoY',   u:'%' },
    { g:'g-q',      k:'qOpYoy',     n:'분기 영업이익 YoY', u:'%' }
  ];

  var PRESETS = [
    { n:'배당귀족',       f:{ divGrowYears:[5,null], payout:[20,60], profitStreak:[5,null] } },
    { n:'고ROE 우량주',   f:{ roeAvg:[15,null], debt:[null,100], profitStreak:[5,null] } },
    { n:'꾸준한 성장주',  f:{ revStreak:[5,null], margin:[10,null] } },
    { n:'턴어라운드',     f:{ turnaround:[1,1] } },
    { n:'고배당',         f:{ yield:[4,null], payout:[null,70], divYears:[3,null] } },
    { n:'실적 서프라이즈', f:{ qOpYoy:[50,null] } },
    { n:'저평가 알짜',    f:{ roe:[10,null], debt:[null,80], margin:[10,null], lossCount:[null,0] } }
  ];

  var COLS = [
    { k:'name',   n:'종목' },
    { k:'rev',    n:'매출(억)',   f:'int' },
    { k:'op',     n:'영업이익(억)', f:'int' },
    { k:'margin', n:'영업이익률', f:'pct' },
    { k:'roe',    n:'ROE',       f:'pct' },
    { k:'debt',   n:'부채비율',   f:'pct' },
    { k:'revCagr5', n:'매출CAGR5', f:'pct', sign:true },
    { k:'dps',    n:'DPS(원)',    f:'int' },
    { k:'payout', n:'배당성향',   f:'pct' },
    { k:'divGrowYears', n:'배당증가', f:'yr' },
    { k:'qOpYoy', n:'분기OP YoY', f:'pct', sign:true }
  ];

  var DATA = null, F = null, IDX = {}, rows = [], sortKey = 'rev', sortDir = -1;

  function $(id) { return document.getElementById(id); }
  function val(r, k) { return r[IDX[k]]; }

  /* ---------- UI 만들기 ---------- */
  function buildFilters() {
    var groups = {};
    FILTERS.forEach(function (f) { (groups[f.g] = groups[f.g] || []).push(f); });
    Object.keys(groups).forEach(function (g) {
      $(g).innerHTML = groups[g].map(function (f) {
        return '<div class="f"><span class="nm">' + f.n + '</span>' +
          '<input type="number" inputmode="decimal" data-k="' + f.k + '" data-b="min" placeholder="최소">' +
          '<span class="tilde">~</span>' +
          '<input type="number" inputmode="decimal" data-k="' + f.k + '" data-b="max" placeholder="최대">' +
          '<span class="unit">' + f.u + '</span></div>';
      }).join('');
    });

    $('markets').innerHTML = ['코스피', '코스닥', '코넥스', '기타', '미분류'].map(function (m) {
      return '<label><input type="checkbox" class="mk" value="' + m + '" checked>' + m + '</label>';
    }).join('');

    $('presets').innerHTML = PRESETS.map(function (p, i) {
      return '<button class="preset" data-i="' + i + '" aria-pressed="false">' + p.n + '</button>';
    }).join('');

    $('sort').innerHTML = COLS.filter(function (c) { return c.k !== 'name'; })
      .map(function (c) { return '<option value="' + c.k + '">' + c.n + ' 높은 순</option>'; })
      .join('') +
      COLS.filter(function (c) { return c.k !== 'name'; })
      .map(function (c) { return '<option value="' + c.k + '|asc">' + c.n + ' 낮은 순</option>'; })
      .join('');
  }

  function readFilters() {
    var out = {};
    document.querySelectorAll('.f input').forEach(function (el) {
      var v = el.value.trim();
      el.classList.toggle('on', v !== '');
      if (v === '') return;
      var num = parseFloat(v);
      if (isNaN(num)) return;
      out[el.dataset.k] = out[el.dataset.k] || [null, null];
      out[el.dataset.k][el.dataset.b === 'min' ? 0 : 1] = num;
    });
    return out;
  }

  function selectedMarkets() {
    var s = [];
    document.querySelectorAll('.mk').forEach(function (el) { if (el.checked) s.push(el.value); });
    return s;
  }

  /* ---------- 필터링 ---------- */
  function apply() {
    if (!DATA) return;
    var f = readFilters(), mks = selectedMarkets();
    var out = DATA.rows.filter(function (r) {
      var mk = val(r, 'market') || '미분류';
      if (mks.indexOf(mk) < 0) return false;
      for (var k in f) {
        var v = val(r, k);
        if (v === null || v === undefined) return false;   // 값 없으면 제외
        if (f[k][0] !== null && v < f[k][0]) return false;
        if (f[k][1] !== null && v > f[k][1]) return false;
      }
      return true;
    });

    var sv = $('sort').value.split('|');
    sortKey = sv[0]; sortDir = sv[1] === 'asc' ? 1 : -1;
    out.sort(function (a, b) {
      var x = val(a, sortKey), y = val(b, sortKey);
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      return (x - y) * sortDir;
    });

    rows = out;
    render();
  }

  function fmt(v, kind, sign) {
    if (v === null || v === undefined) return '–';
    if (kind === 'int') return Math.round(v).toLocaleString('ko-KR');
    if (kind === 'pct') return (sign && v > 0 ? '+' : '') + v.toFixed(1) + '%';
    if (kind === 'yr') return v + '년';
    return v;
  }

  function render() {
    $('count').innerHTML = '<b>' + rows.length.toLocaleString('ko-KR') + '</b>개 종목';
    var t = $('tbl');
    t.querySelector('thead').innerHTML = '<tr>' + COLS.map(function (c) {
      return '<th data-k="' + c.k + '">' + c.n + (c.k === sortKey ? (sortDir < 0 ? ' ▾' : ' ▴') : '') + '</th>';
    }).join('') + '</tr>';

    var show = rows.slice(0, 300);
    t.querySelector('tbody').innerHTML = show.map(function (r) {
      return '<tr data-code="' + val(r, 'code') + '">' + COLS.map(function (c) {
        if (c.k === 'name') {
          return '<td class="name">' + val(r, 'name') +
                 '<span class="mk">' + (val(r, 'market') || '') + '</span></td>';
        }
        var v = val(r, c.k);
        var cls = c.sign && v !== null ? (v > 0 ? 'pos' : v < 0 ? 'neg' : '') : '';
        return '<td class="' + cls + '">' + fmt(v, c.f, c.sign) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    $('empty').style.display = rows.length ? 'none' : 'block';
    $('empty').textContent = '조건에 맞는 종목이 없습니다. 조건을 완화해보세요.';
    if (rows.length > 300) {
      $('count').innerHTML += ' <span style="font-weight:400;color:var(--text-mute);font-size:12px">' +
        '(상위 300개 표시)</span>';
    }
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('input', function (e) {
    if (e.target.closest('.f') || e.target.classList.contains('mk')) {
      document.querySelectorAll('.preset').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
      apply();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.classList.contains('mk') || e.target.id === 'sort') apply();
  });

  $('presets').addEventListener('click', function (e) {
    var b = e.target.closest('.preset');
    if (!b) return;
    var on = b.getAttribute('aria-pressed') === 'true';
    document.querySelectorAll('.f input').forEach(function (el) { el.value = ''; });
    document.querySelectorAll('.preset').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
    if (!on) {
      b.setAttribute('aria-pressed', 'true');
      var f = PRESETS[+b.dataset.i].f;
      Object.keys(f).forEach(function (k) {
        var lo = f[k][0], hi = f[k][1];
        var mn = document.querySelector('.f input[data-k="' + k + '"][data-b="min"]');
        var mx = document.querySelector('.f input[data-k="' + k + '"][data-b="max"]');
        if (mn && lo !== null) mn.value = lo;
        if (mx && hi !== null) mx.value = hi;
      });
    }
    apply();
  });

  $('btn-reset').addEventListener('click', function () {
    document.querySelectorAll('.f input').forEach(function (el) { el.value = ''; });
    document.querySelectorAll('.mk').forEach(function (el) { el.checked = true; });
    document.querySelectorAll('.preset').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
    apply();
  });

  $('tbl').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-code]');
    if (tr) location.href = './index.html?code=' + tr.dataset.code;
    var th = e.target.closest('th[data-k]');
    if (th && th.dataset.k !== 'name') {
      var same = th.dataset.k === sortKey;
      $('sort').value = th.dataset.k + (same && sortDir < 0 ? '|asc' : '');
      apply();
    }
  });

  $('btn-csv').addEventListener('click', function () {
    var head = F.join(',');
    var lines = [head].concat(rows.map(function (r) {
      return r.map(function (v) {
        return v === null || v === undefined ? '' :
          (typeof v === 'string' && v.indexOf(',') >= 0 ? '"' + v + '"' : v);
      }).join(',');
    }));
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'screening_' + rows.length + '.csv';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  });

  $('btn-mode').addEventListener('click', function () {
    var r = document.documentElement;
    r.setAttribute('data-mode', r.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
  });

  /* ---------- 시작 ---------- */
  buildFilters();
  fetch('./data/screen.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('no file'); return r.json(); })
    .then(function (j) {
      DATA = j; F = j.fields;
      F.forEach(function (k, i) { IDX[k] = i; });
      $('src-pill').textContent = j.rows.length.toLocaleString('ko-KR') + '종목 · ' + j.updated;
      apply();
    })
    .catch(function () {
      $('src-pill').textContent = '데이터 없음';
      $('empty').style.display = 'block';
      $('empty').textContent =
        'data/screen.json 을 찾을 수 없습니다. collect.py 를 한 번 실행하면 만들어집니다.';
    });
})();
</script>
</body>
</html>
